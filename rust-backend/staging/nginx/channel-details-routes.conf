# Include in the staging app.d directory along with channel-details-map.conf.
location ~ ^/api/v1/streams/[0-9]+$ {
    recursive_error_pages on;
    error_page 418 = @zulip_rust_channel_details_api;
    error_page 502 503 504 /api_5xx.json;
    if ($zulip_rust_channel_details) {
        return 418;
    }
    include /etc/nginx/zulip-include/api_headers;
    include uwsgi_params;
}

location ~ ^/json/streams/[0-9]+$ {
    recursive_error_pages on;
    error_page 418 = @zulip_rust_channel_details_web;
    error_page 502 503 504 /api_5xx.json;
    if ($zulip_rust_channel_details) {
        return 418;
    }
    include uwsgi_params;
}

location @zulip_rust_channel_details_api {
    error_page 502 503 504 /api_5xx.json;
    include /etc/nginx/zulip-include/api_headers;
    include /etc/nginx/zulip-include/proxy;
    proxy_pass http://127.0.0.1:9997;
}

location @zulip_rust_channel_details_web {
    error_page 502 503 504 /api_5xx.json;
    include /etc/nginx/zulip-include/proxy;
    proxy_pass http://127.0.0.1:9997;
}
